name: Release Userscript

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g., 5.03.01)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Userscript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit test suite
        run: bun test

      - name: Build userscript
        env:
          USERSCRIPT_VERSION: ${{ github.event.inputs.version }}
        run: bun run build

      - name: Validate distribution syntax
        run: node --check dist/fb-clean-my-feeds.user.js

      - name: Inspect generated userscript header
        run: |
          echo "=== Userscript Metadata Header ==="
          head -n 25 dist/fb-clean-my-feeds.user.js

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/fb-clean-my-feeds.user.js
            dist/fb-clean-my-feeds.meta.js
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: "true"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
